[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mickro-agent"
version = "0.1.0"
description = "Small, explicit agent loops for experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
openai = ["openai>=1.0,<3"]
minimax = ["anthropic>=0.68,<1"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]

[tool.ruff]
line-length = 120
target-version = "py311"

